# iOS shared framework validation — TASK-7
#
# Runs on macOS ARM64 (Apple Silicon) to validate the Kotlin/Native iOS
# framework targets. This workflow lives in the hitenpatel/radioshake-ci
# shell repo alongside emulator-e2e.yml. It clones the private Forgejo
# source at runtime and never persists it on GitHub.
#
# Triggered by:
# - workflow_dispatch (manual, with optional ref/sha inputs)
# - repository_dispatch event "radioshake-ios-validate" from Forgejo
#
# What it validates (TASK-7 plan, Task 5 Steps 3–6):
# 1. macOS preflight: uname, Xcode, SDKs, JDK 21, Gradle tasks
# 2. Link all four framework binaries (debug+release × arm64+simulator)
# 3. Audit Obj-C header: intended symbols present, deny-list absent
# 4. Swift typecheck against the framework
# 5. iOS simulator common/debug tests + release logging policy tests
# 6. Full JVM/Android/Wear regression suite

name: ios-shared-validate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Forgejo branch or tag to clone'
        default: 'feat/task-7-ios-shared-framework'
      sha:
        description: 'Expected HEAD SHA (leave empty to skip check)'
        default: ''
  repository_dispatch:
    types: [radioshake-ios-validate]

permissions:
  contents: read

env:
  # TASK-141 AC #3: toolchain pinned to exact values present on the macos-26
  # image (20261021.x: Xcode 26.6, iOS 26.5 simulator runtime). The preflight
  # step fails loudly if either disappears, so image drift is a visible
  # red run instead of a silent toolchain change.
  XCODE_APP: /Applications/Xcode_26.6.app
  SIM_OS: '26.5'
  # Deny-list: source-owned symbols that must NOT appear in the framework header
  HEADER_DENY: 'RadioBrowserApiService|ShazamApiService|StationDto|DatabaseDriverFactory|FavouriteRepository|StationRepository|SongLogRepository'
  # Allow-list: intended Swift-facing symbols that MUST appear
  HEADER_ALLOW: 'IosSharedFacade|IosStation|IosCancellation|IosErrorCode|IosSharedFacadeTestFactory|IosRegionStatus|IosRegionKind'

jobs:
  validate:
    # TASK-141 AC #3: pin the runner image explicitly so Xcode / SDK / arch
    # cannot silently drift. macos-26 = Apple Silicon (arm64) image.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Single source of truth for what gets uploaded: the secret scan and
      # the upload step both read this list, so they cannot drift apart.
      EVIDENCE_PATHS: |
        /tmp/RadioShakeShared-header.h
        /tmp/Task7FacadeSmoke.swift
        src/shared/build/reports/
        src/shared/build/test-results/
        /tmp/ios-logs/
        /tmp/ios-app-build.xcresult
        /tmp/ios-app-test.xcresult
        /tmp/ios-app-build-release.xcresult
        /tmp/ios-app-bundle-sha256.txt
        /tmp/ios-app-bundle-digest.txt
        /tmp/ios-app-release-bundle-sha256.txt
        /tmp/ios-app-release-bundle-digest.txt
    outputs:
      head_sha: ${{ steps.clone.outputs.head_sha }}

    steps:
      # ── Clone source from private Forgejo host ──────────────────────
      - name: Clone source from private host
        id: clone
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ inputs.ref || github.event.client_payload.ref || 'feat/task-7-ios-shared-framework' }}
          EXPECTED_SHA: ${{ inputs.sha || github.event.client_payload.sha || '' }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOST"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src

          # Verify auth was not persisted
          if grep -rq "AUTHORIZATION" src/.git/config; then
            echo "::error::auth header was persisted in src/.git/config"
            exit 1
          fi

          HEAD_SHA=$(git -C src rev-parse HEAD)

          # TASK-141 AC #4: when an expected SHA is given, the job must
          # validate exactly that commit, not whatever the branch tip is now.
          if [ -n "$EXPECTED_SHA" ]; then
            if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
              echo "Branch tip $HEAD_SHA != expected $EXPECTED_SHA; deepening history"
              # Ancestry needs real history, so unshallow the branch first.
              if [ "$(git -C src rev-parse --is-shallow-repository)" = "true" ]; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --unshallow origin "$REF" \
                  || { echo "::error::could not fetch full history of $REF"; exit 1; }
              fi
              # If the SHA is still unknown locally, try fetching it directly
              # (only succeeds when the server allows fetch-by-SHA).
              if ! git -C src cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --depth 1 origin "$EXPECTED_SHA" 2>/dev/null || true
              fi
              FULL_SHA=$(git -C src rev-parse --verify -q "${EXPECTED_SHA}^{commit}" || true)
              if [ -z "$FULL_SHA" ]; then
                echo "::error::expected SHA $EXPECTED_SHA does not exist in $REF"
                exit 1
              fi
              # The SHA must belong to the branch, not just exist on the host.
              if ! git -C src merge-base --is-ancestor "$FULL_SHA" "origin/$REF"; then
                echo "::error::expected SHA $FULL_SHA is not an ancestor of origin/$REF"
                exit 1
              fi
              git -C src checkout --detach "$FULL_SHA" \
                || { echo "::error::could not check out $FULL_SHA"; exit 1; }
              HEAD_SHA=$(git -C src rev-parse HEAD)
            fi
            if [ "$HEAD_SHA" != "$(git -C src rev-parse --verify "${EXPECTED_SHA}^{commit}")" ]; then
              echo "::error::checked-out $HEAD_SHA does not match expected $EXPECTED_SHA"
              exit 1
            fi
          fi

          # Only record the SHA once it is verified, so report-status never
          # posts success for, or substitutes the branch tip for, a commit
          # the job did not validate (an unverified run leaves the output
          # empty and report-status falls back to the requested SHA).
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Cloned $REF at $HEAD_SHA"

      - name: Region tables are generated from pinned inputs
        working-directory: src
        run: |
          set -euo pipefail
          python3 scripts/gen_region_tables.py --check
          python3 -m unittest scripts/test_gen_region_tables.py scripts/test_check_xcstrings.py

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'

      # ── macOS preflight (TASK-141 AC #3) ────────────────────────────
      - name: macOS preflight
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected arm64, got $ARCH"
            exit 1
          fi

          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is missing; the macos-26 image changed. Update XCODE_APP / SIM_OS in workflow env to the image's versions. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          mkdir -p /tmp/ios-logs

          echo "=== xcode-select -p ==="
          xcode-select -p
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== uname -m ==="
          echo "$ARCH"
          echo "=== java -version ==="
          java -version
          echo "=== iOS SDK (device) ==="
          xcrun --sdk iphoneos --show-sdk-path
          echo "=== iOS SDK (simulator) ==="
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "=== xcrun simctl list runtimes ==="
          xcrun simctl list runtimes | tee /tmp/simctl-runtimes.txt
          if ! grep -qF "iOS ${SIM_OS} (" /tmp/simctl-runtimes.txt; then
            echo "::error::iOS ${SIM_OS} simulator runtime not installed; update XCODE_APP / SIM_OS in workflow env to the image's versions"
            exit 1
          fi
          echo "=== iPhone 17 simulator under iOS ${SIM_OS} ==="
          xcrun simctl list devices available \
            | awk -v hdr="-- iOS ${SIM_OS} --" '$0 == hdr {f=1; next} /^-- /{f=0} f' \
            | grep -F "iPhone 17 (" \
            || { echo "::error::no iPhone 17 simulator under iOS ${SIM_OS}; update XCODE_APP / SIM_OS in workflow env to the image's versions"; exit 1; }

      - name: Verify JDK and Gradle
        working-directory: src
        run: |
          java -version
          ./gradlew --version

      - name: Verify Gradle iOS tasks exist
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew :shared:tasks --all > /tmp/task7-shared-tasks-macos.txt

          for task in \
            iosSimulatorArm64Test \
            linkDebugFrameworkIosSimulatorArm64 \
            linkReleaseFrameworkIosSimulatorArm64 \
            linkDebugFrameworkIosArm64 \
            linkReleaseFrameworkIosArm64 \
            iosSimulatorArm64ReleasePolicyTest; do
            if grep -q "$task" /tmp/task7-shared-tasks-macos.txt; then
              echo "✓ $task"
            else
              echo "::error::Missing expected task: $task"
              exit 1
            fi
          done

      # ── Link all four framework binaries ────────────────────────────
      - name: Link all framework binaries
        working-directory: src
        run: |
          ./gradlew --no-daemon \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            :shared:linkReleaseFrameworkIosSimulatorArm64 \
            :shared:linkDebugFrameworkIosArm64 \
            :shared:linkReleaseFrameworkIosArm64

      - name: Verify Mach-O binaries
        working-directory: src
        run: |
          set -euo pipefail
          BINARIES=$(find shared/build/bin -path '*RadioShakeShared.framework/RadioShakeShared' -type f)
          COUNT=$(echo "$BINARIES" | wc -l | tr -d ' ')
          echo "Found $COUNT framework binaries:"
          echo "$BINARIES"

          if [ "$COUNT" -ne 4 ]; then
            echo "::error::Expected 4 framework binaries, got $COUNT"
            exit 1
          fi

          for bin in $BINARIES; do
            FILE_INFO=$(file "$bin")
            echo "$FILE_INFO"
            # Static frameworks (isStatic = true) produce ar archives, not Mach-O.
            # XCFramework aggregation from Kotlin 2.1 may report per-target binaries
            # in either form. Accept both.
            if ! echo "$FILE_INFO" | grep -qE "Mach-O|current ar archive|Mach-O universal"; then
              echo "::error::$bin is neither Mach-O nor a static archive"
              exit 1
            fi
          done

      # ── Audit Obj-C header ──────────────────────────────────────────
      - name: Audit framework header (allow/deny symbols)
        working-directory: src
        run: |
          set -euo pipefail
          # Use the simulator debug header for inspection
          HEADER=$(find shared/build/bin -path '*iosSimulatorArm64/debugFramework/RadioShakeShared.framework/Headers/*.h' -type f | head -1)
          echo "Inspecting header: $HEADER"

          echo ""
          echo "=== Allow-list check ==="
          ALLOW_FAIL=0
          for sym in IosSharedFacade IosStation IosCancellation IosErrorCode IosRegionStatus IosRegionKind; do
            if grep -q "$sym" "$HEADER"; then
              echo "✓ $sym present"
            else
              echo "✗ $sym MISSING"
              ALLOW_FAIL=1
            fi
          done

          echo ""
          echo "=== Deny-list check ==="
          DENY_FAIL=0
          for sym in RadioBrowserApiService ShazamApiService StationDto DatabaseDriverFactory FavouriteRepository StationRepository SongLogRepository IosRegionResolver; do
            if grep -q "$sym" "$HEADER"; then
              echo "✗ $sym LEAKED into header"
              DENY_FAIL=1
            else
              echo "✓ $sym absent"
            fi
          done

          echo ""
          echo "=== Unavoidable generated symbols (record, not block) ==="
          # SQLDelight generated symbols cannot be hidden; record them
          grep -oE '\b(RadioShakeDatabase|FavouriteQueries|StationQueries|SongLogQueries)\b' "$HEADER" | sort -u | while read -r sym; do
            echo "⚠ Generated symbol present: $sym (expected, unreachable from facade)"
          done || true

          if [ "$ALLOW_FAIL" -ne 0 ] || [ "$DENY_FAIL" -ne 0 ]; then
            echo "::error::Header audit failed"
            exit 1
          fi

          # Save full header for artifact
          cp "$HEADER" /tmp/RadioShakeShared-header.h

      # ── Swift typecheck ─────────────────────────────────────────────
      - name: Swift typecheck against framework
        working-directory: src
        run: |
          set -euo pipefail
          # Write the Swift smoke file
          cat > /tmp/Task7FacadeSmoke.swift << 'SWIFT'
          import Foundation
          import RadioShakeShared

          @MainActor
          final class StationsModel: ObservableObject {
              @Published private(set) var stations: [IosStation] = []
              @Published private(set) var error: IosErrorCode?
              private let shared: IosSharedFacade
              private var search: IosCancellation?
              private var favourites: IosCancellation?

              init(databasePath: String) {
                  shared = IosSharedFacade(baseUrl: "https://de1.api.radio-browser.info",
                      databasePath: databasePath, destructiveRecoveryEnabled: false)
                  favourites = shared.observeFavourites { [weak self] in self?.stations = $0 }
              }
              func search(_ query: String) {
                  search?.cancel()
                  search = shared.searchStations(query: query, limit: 30) { [weak self] values, error in
                      self?.stations = values; self?.error = error
                  }
              }
              func setFavourite(_ station: IosStation, enabled: Bool) {
                  _ = shared.setFavourite(station: station, isFavourite: enabled) { [weak self] in self?.error = $0 }
              }
              deinit { search?.cancel(); favourites?.cancel(); shared.close() }
          }
          SWIFT

          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          FRAMEWORK_PATH="shared/build/bin/iosSimulatorArm64/debugFramework"

          echo "SDK: $SDK_PATH"
          echo "Framework: $FRAMEWORK_PATH"

          xcrun swiftc -typecheck /tmp/Task7FacadeSmoke.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0-simulator \
            -F "$FRAMEWORK_PATH" \
            -framework RadioShakeShared

          echo "✓ Swift typecheck passed"

      # ── iOS simulator tests ─────────────────────────────────────────
      - name: Run iOS simulator debug tests
        working-directory: src
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      - name: Run iOS simulator release logging policy tests
        working-directory: src
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64ReleasePolicyTest

      # ── iOS app build + XCTest ──────────────────────────────────────
      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          VERSION="2.42.0"
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mv /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo cp -R /tmp/xcodegen/xcodegen/share/* /usr/local/share/ || true
          xcodegen --version

      - name: Assemble shared XCFrameworks (Debug + Release) and point symlink at Debug
        working-directory: src
        run: |
          set -euo pipefail
          # Build BOTH per-config XCFrameworks up front. Cheap (Kotlin caches),
          # avoids re-running Gradle between the Debug and Release xcodebuild
          # invocations later in this job.
          ./gradlew --no-daemon \
            :shared:assembleRadioShakeSharedDebugXCFramework \
            :shared:assembleRadioShakeSharedReleaseXCFramework
          for cfg in debug release; do
            test -d "shared/build/XCFrameworks/$cfg/RadioShakeShared.xcframework" \
              || { echo "::error::$cfg XCFramework not produced"; exit 1; }
          done
          # Initialise the `current/` symlink to the debug XCFramework so
          # `xcodegen generate`'s file-reference validation passes. The Xcode
          # preBuildScript re-points the symlink per configuration at each
          # xcodebuild invocation.
          mkdir -p shared/build/XCFrameworks/current
          rm -rf shared/build/XCFrameworks/current/RadioShakeShared.xcframework
          ln -sfn "$PWD/shared/build/XCFrameworks/debug/RadioShakeShared.xcframework" \
                  "$PWD/shared/build/XCFrameworks/current/RadioShakeShared.xcframework"
          ls -la shared/build/XCFrameworks/current/

      - name: Generate Xcode project
        working-directory: src/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project RadioShake.xcodeproj -list

      - name: Build iOS app (simulator, unsigned)
        working-directory: src/ios
        run: |
          set -euo pipefail
          mkdir -p /tmp/derived-data /tmp/ios-logs
          xcodebuild build \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Debug \
            -destination "platform=iOS Simulator,OS=${SIM_OS},name=iPhone 17" \
            -derivedDataPath /tmp/derived-data \
            -resultBundlePath /tmp/ios-app-build.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/ios-logs/debug-build.log

      - name: String Catalog covers every source string and is fully translated
        working-directory: src/ios
        run: |
          set -euo pipefail
          rm -rf /tmp/xcloc
          xcodebuild -exportLocalizations \
            -project RadioShake.xcodeproj \
            -localizationPath /tmp/xcloc \
            -exportLanguage de \
            CODE_SIGNING_ALLOWED=NO
          XLIFF=$(find /tmp/xcloc -name 'de.xliff' | head -1)
          test -n "$XLIFF" || { echo "::error::no de.xliff exported"; exit 1; }
          python3 ../scripts/check_xcstrings.py App/Localizable.xcstrings --xliff "$XLIFF"

      - name: Verify app has no distribution signature
        run: |
          set -euo pipefail
          APP="/tmp/derived-data/Build/Products/Debug-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::app not found at $APP"; exit 1; }
          OUT=$(codesign -dv "$APP" 2>&1 || true)
          echo "$OUT"
          # Xcode 26 on Apple Silicon simulator adds an adhoc/linker-signed
          # signature to every binary — this counts as unsigned for our
          # purposes. The real invariant AC #5 protects is: no developer
          # team identifier + no distribution signature.
          if echo "$OUT" | grep -q "TeamIdentifier=not set" \
             && ! echo "$OUT" | grep -q "^Authority="; then
            if echo "$OUT" | grep -qE "code object is not signed|Signature=adhoc"; then
              echo "OK — no team, no distribution signature"
            else
              echo "::error::signature is neither absent nor adhoc"
              exit 1
            fi
          else
            echo "::error::app carries a team identifier or authority (distribution signature)"
            exit 1
          fi

      - name: Run XCTest unit + UI tests
        working-directory: src/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Debug \
            -destination "platform=iOS Simulator,OS=${SIM_OS},name=iPhone 17" \
            -derivedDataPath /tmp/derived-data \
            -resultBundlePath /tmp/ios-app-test.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/ios-logs/xctest.log

      # TASK-141 AC #5 / TASK-174 follow-up: the StoreKit storefront test
      # skips itself when the simulator has no storefront. On CI it must
      # actually run; a skip here means the CI storefront was lost.
      - name: StoreKit storefront test ran and was not skipped
        run: |
          set -euo pipefail
          LOG=/tmp/ios-logs/xctest.log
          if grep -E "Test Case '.*StoreKitStorefrontTests.*' skipped" "$LOG"; then
            echo "::error::StoreKitStorefrontTests was skipped on CI (no simulator storefront)"
            exit 1
          fi
          if ! grep -qE "Test Case '.*StoreKitStorefrontTests.*' passed" "$LOG"; then
            echo "::error::StoreKitStorefrontTests did not run or did not pass"
            exit 1
          fi
          echo "OK - StoreKitStorefrontTests ran and passed"

      - name: Record app bundle checksum
        run: |
          set -euo pipefail
          APP="/tmp/derived-data/Build/Products/Debug-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::app not found at $APP"; exit 1; }
          find "$APP" -type f -exec shasum -a 256 {} + \
            | sort -k2 > /tmp/ios-app-bundle-sha256.txt
          shasum -a 256 /tmp/ios-app-bundle-sha256.txt \
            | tee /tmp/ios-app-bundle-digest.txt

      # ── Release build verification (TASK-149) ───────────────────────
      - name: Build iOS app (Release, simulator, unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          # Repoint the current-config symlink at the release XCFramework
          # before invoking the Release xcodebuild. The Xcode preBuildScript
          # also re-points it, but Xcode's file-reference validation happens
          # BEFORE build phases run, so the symlink must be correct up front.
          rm -rf shared/build/XCFrameworks/current/RadioShakeShared.xcframework
          ln -sfn "$PWD/shared/build/XCFrameworks/release/RadioShakeShared.xcframework" \
                  "$PWD/shared/build/XCFrameworks/current/RadioShakeShared.xcframework"
          cd ios
          mkdir -p /tmp/derived-data-release /tmp/ios-logs
          # ARCHS=arm64 + ONLY_ACTIVE_ARCH=YES restrict Release simulator build
          # to arm64. Kotlin XCFramework only ships iosSimulatorArm64 (no
          # x86_64 slice), so x86_64 linkage fails with "symbols not found".
          # This is fine — Apple Silicon macOS is the only supported runner.
          xcodebuild build \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Release \
            -destination "platform=iOS Simulator,OS=${SIM_OS},name=iPhone 17" \
            -derivedDataPath /tmp/derived-data-release \
            -resultBundlePath /tmp/ios-app-build-release.xcresult \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/ios-logs/release-build.log
          RELEASE_APP="/tmp/derived-data-release/Build/Products/Release-iphonesimulator/RadioShake.app"
          test -d "$RELEASE_APP" || { echo "::error::release app not found"; exit 1; }
          # Sanity: the linked XCFramework is the release one. Compare a
          # release-only sqliter symbol strip (release strips more).
          echo "Release app bundle:"
          ls "$RELEASE_APP"
          # Restore symlink to debug for any downstream steps that assume Debug.
          cd ..
          rm -rf shared/build/XCFrameworks/current/RadioShakeShared.xcframework
          ln -sfn "$PWD/shared/build/XCFrameworks/debug/RadioShakeShared.xcframework" \
                  "$PWD/shared/build/XCFrameworks/current/RadioShakeShared.xcframework"

      - name: Record Release app bundle checksum
        run: |
          set -euo pipefail
          APP="/tmp/derived-data-release/Build/Products/Release-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::release app not found at $APP"; exit 1; }
          find "$APP" -type f -exec shasum -a 256 {} + \
            | sort -k2 > /tmp/ios-app-release-bundle-sha256.txt
          shasum -a 256 /tmp/ios-app-release-bundle-sha256.txt \
            | tee /tmp/ios-app-release-bundle-digest.txt

      - name: Audit Release binary for debug-only symbols (TASK-136 + TASK-137)
        run: |
          set -euo pipefail
          APP="/tmp/derived-data-release/Build/Products/Release-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::release app not found"; exit 1; }
          strings "$APP/RadioShake" > /tmp/release-strings.txt
          # IosSharedFacadeTestFactory is a KMP-exported symbol (present in
          # the shared framework binary for both Debug and Release configs).
          # It's on HEADER_ALLOW instead of DENY — the invariant is that
          # NO SWIFT CALLER references it in Release (all call sites are
          # inside #if DEBUG blocks in SharedContext.makeForTesting).
          DENY='ui-test-reset-onboarding|ui-test-skip-onboarding|resetOnboardingForTesting|setCompletedForTesting|LaunchArguments|applyForTesting|ui-test-fixture-endpoints|ui-test-fake-player|FixtureURLProtocol|FixtureRouteTable|FixtureBundle|FakePlayerEngine|useFakeNetworkForTesting|usePlayerModeForTesting|PlayerModeMarker|player-mode-marker|RegionForceDetection|RegionDebugOverride'
          if grep -qE "$DENY" /tmp/release-strings.txt; then
            echo "::error::Release binary contains debug-only symbols:"
            grep -E "$DENY" /tmp/release-strings.txt
            exit 1
          fi
          if find "$APP" \( -path '*Fixtures/*' -o -name 'top-stations-*.json' -o -name 'search-*.json' -o -name 'FixtureURLProtocol*' -o -name 'FakePlayerEngine*' \) | grep -q .; then
            echo "::error::Release .app bundle contains test-only fixture files:"
            find "$APP" \( -path '*Fixtures/*' -o -name 'top-stations-*.json' -o -name 'search-*.json' -o -name 'FixtureURLProtocol*' -o -name 'FakePlayerEngine*' \)
            exit 1
          fi
          echo "OK — no debug-only symbols and no fixture files in Release binary/bundle"

      # ── Full regression suite ───────────────────────────────────────
      - name: Run JVM + Android + Wear regression tests
        working-directory: src
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon \
            :shared:jvmTest \
            :shared:testDebugUnitTest \
            :shared:testReleaseUnitTest \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest

      # ── Record evidence ─────────────────────────────────────────────
      - name: Record validation evidence
        if: always()
        working-directory: src
        run: |
          set -euo pipefail
          echo "=== Validation Evidence ==="
          echo "SHA: $(git rev-parse HEAD)"
          echo "Runner: $(uname -a)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "SDK (device): $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK (simulator): $(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Date: $(date -u)"

          # List test reports
          echo ""
          echo "=== Test Reports ==="
          find shared/build/reports -name '*.xml' -o -name '*.html' 2>/dev/null | head -20 || echo "(none)"

      # Nothing uploaded may contain the Forgejo tokens (raw, or the base64
      # basic-auth value the clone step builds). xcresult blobs are
      # zstd-compressed, so every file is also scanned decompressed. Fails
      # closed: unreadable files or a missing decompressor fail the step.
      # Prints paths only, never a secret value.
      - name: Secret scan of evidence artifacts
        id: secret_scan
        if: always()
        env:
          FORGEJO_CLONE_TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          FORGEJO_STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
        run: |
          set +e -u -o pipefail
          NEED_ZSTD=0
          while IFS= read -r p; do
            case "$p" in *.xcresult) [ -e "$p" ] && NEED_ZSTD=1 ;; esac
          done <<< "$EVIDENCE_PATHS"
          if [ "$NEED_ZSTD" = 1 ] && ! command -v zstd >/dev/null 2>&1; then
            brew install zstd >/dev/null 2>&1
          fi
          python3 - <<'PY'
          import base64, os, subprocess, shutil, sys

          needles = {}
          for name in ("FORGEJO_CLONE_TOKEN", "FORGEJO_STATUS_TOKEN"):
              v = os.environ.get(name, "")
              if v:
                  needles[name] = v.encode()
          clone = os.environ.get("FORGEJO_CLONE_TOKEN", "")
          if clone:
              needles["CLONE_AUTH_BASE64"] = base64.b64encode(b"oauth2:" + clone.encode())

          ZSTD_MAGIC = b"\x28\xb5\x2f\xfd"
          zstd = shutil.which("zstd")
          leaked, failed, scanned_files, scanned_paths, decompressed = [], [], 0, 0, 0

          def hit(data):
              return [n for n, v in needles.items() if v in data]

          def check(label, data, path):
              for n in hit(data):
                  leaked.append((n, label))

          for p in [x.strip() for x in os.environ["EVIDENCE_PATHS"].splitlines() if x.strip()]:
              if not os.path.exists(p):
                  continue
              scanned_paths += 1
              is_bundle = p.rstrip("/").endswith(".xcresult")
              files = []
              if os.path.isdir(p):
                  for root, _, names in os.walk(p):
                      files += [os.path.join(root, n) for n in names]
              else:
                  files = [p]
              for f in files:
                  label = p if is_bundle else f
                  try:
                      with open(f, "rb") as fh:
                          data = fh.read()
                  except OSError:
                      failed.append(label)
                      continue
                  scanned_files += 1
                  check(label, data, f)
                  if data.startswith(ZSTD_MAGIC):
                      if zstd is None:
                          failed.append(label + " (zstd decompressor unavailable)")
                          continue
                      r = subprocess.run([zstd, "-dcq"], input=data, capture_output=True)
                      if r.returncode != 0:
                          failed.append(label + " (zstd decompress failed)")
                          continue
                      decompressed += 1
                      check(label, r.stdout, f)

          print(f"Scanned {scanned_paths} evidence paths, {scanned_files} files, {decompressed} zstd blobs decompressed; {len(needles)} needles")
          for n, label in sorted(set(leaked)):
              print(f"::error::{n} value found in {label}")
          for label in sorted(set(failed)):
              print(f"::error::could not scan {label}")
          if leaked or failed:
              print("::error::secret scan failed; artifacts will not be uploaded")
              sys.exit(1)
          print("OK - no secret values in evidence artifacts")
          PY

      - name: Upload artifacts
        if: always() && steps.clone.outcome == 'success' && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ios-validate-evidence
          retention-days: 30
          if-no-files-found: error
          # NEVER upload source, local.properties, or gradle caches
          path: ${{ env.EVIDENCE_PATHS }}

  # TASK-141 AC #6: the Forgejo status callback is a separate job that
  # needs `validate`. It runs only after the whole job — including the
  # artifact upload — has finished, so an upload failure flips
  # needs.validate.result to failure and Forgejo sees red. When the
  # callback was the penultimate step inside `validate`, a later
  # artifact-upload failure could never influence the posted state.
  report-status:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post status to Forgejo
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha || github.event.client_payload.sha || inputs.sha || '' }}
          RESULT: ${{ needs.validate.result }}
        run: |
          set -eu
          echo "::add-mask::$STATUS_TOKEN"
          echo "::add-mask::$HOST"

          if [ -z "$HEAD_SHA" ]; then
            echo "::error::No HEAD SHA available for status callback"
            exit 1
          fi

          # needs.validate.result is success|failure|cancelled|skipped.
          # Anything other than success is a red gate: an all-skipped
          # or cancelled run is not a green run.
          STATE="failure"
          if [ "$RESULT" = "success" ]; then STATE="success"; fi

          # A status that never reaches Forgejo must fail this job, so a
          # green GitHub run always means Forgejo saw the result.
          POSTED=0
          for ATTEMPT in 1 2 3; do
            if curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: token $STATUS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${HOST}/api/v1/repos/hiten/RadioShake/statuses/${HEAD_SHA}" \
              -d "{\"state\":\"${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"iOS shared framework validation (job=${RESULT})\",\"context\":\"github/ios-validate\"}"; then
              POSTED=1
              break
            fi
            echo "::warning::status POST attempt ${ATTEMPT}/3 failed"
            if [ "$ATTEMPT" -lt 3 ]; then sleep 5; fi
          done
          if [ "$POSTED" -ne 1 ]; then
            echo "::error::Failed to post status to Forgejo after 3 attempts"
            exit 1
          fi

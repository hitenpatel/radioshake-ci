# iOS shared framework validation — TASK-7
#
# Runs on macOS ARM64 (Apple Silicon) to validate the Kotlin/Native iOS
# framework targets. This workflow lives in the hitenpatel/radioshake-ci
# shell repo alongside emulator-e2e.yml. It clones the private Forgejo
# source at runtime and never persists it on GitHub.
#
# Triggered by:
# - workflow_dispatch (manual, with optional ref/sha inputs)
# - repository_dispatch event "radioshake-ios-validate" from Forgejo
#
# What it validates (TASK-7 plan, Task 5 Steps 3–6):
# 1. macOS preflight: uname, Xcode, SDKs, JDK 21, Gradle tasks
# 2. Link all four framework binaries (debug+release × arm64+simulator)
# 3. Audit Obj-C header: intended symbols present, deny-list absent
# 4. Swift typecheck against the framework
# 5. iOS simulator common/debug tests + release logging policy tests
# 6. Full JVM/Android/Wear regression suite

name: ios-shared-validate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Forgejo branch or tag to clone'
        default: 'feat/task-7-ios-shared-framework'
      sha:
        description: 'Expected HEAD SHA (leave empty to skip check)'
        default: ''
  repository_dispatch:
    types: [radioshake-ios-validate]

permissions:
  contents: read

env:
  # Deny-list: source-owned symbols that must NOT appear in the framework header
  HEADER_DENY: 'RadioBrowserApiService|ShazamApiService|StationDto|DatabaseDriverFactory|FavouriteRepository|StationRepository|SongLogRepository'
  # Allow-list: intended Swift-facing symbols that MUST appear
  HEADER_ALLOW: 'IosSharedFacade|IosStation|IosCancellation|IosErrorCode'

jobs:
  validate:
    # GitHub-hosted macOS Apple Silicon runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # ── Clone source from private Forgejo host ──────────────────────
      - name: Clone source from private host
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ inputs.ref || github.event.client_payload.ref || 'feat/task-7-ios-shared-framework' }}
          EXPECTED_SHA: ${{ inputs.sha || github.event.client_payload.sha || '' }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOST"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src

          HEAD_SHA=$(git -C src rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Cloned $REF at $HEAD_SHA"

          # Verify auth was not persisted
          ! grep -rq "AUTHORIZATION" src/.git/config

          # Optional SHA check
          if [ -n "$EXPECTED_SHA" ] && [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD $HEAD_SHA does not match expected $EXPECTED_SHA"
            exit 1
          fi

      # ── macOS preflight ─────────────────────────────────────────────
      - name: macOS preflight
        run: |
          set -euo pipefail
          echo "=== Architecture ==="
          uname -m
          ARCH=$(uname -m)
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected arm64, got $ARCH"
            exit 1
          fi

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== iOS SDK (device) ==="
          xcrun --sdk iphoneos --show-sdk-path

          echo "=== iOS SDK (simulator) ==="
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify JDK and Gradle
        working-directory: src
        run: |
          java -version
          ./gradlew --version

      - name: Verify Gradle iOS tasks exist
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew :shared:tasks --all > /tmp/task7-shared-tasks-macos.txt

          for task in \
            iosSimulatorArm64Test \
            linkDebugFrameworkIosSimulatorArm64 \
            linkReleaseFrameworkIosSimulatorArm64 \
            linkDebugFrameworkIosArm64 \
            linkReleaseFrameworkIosArm64 \
            iosSimulatorArm64ReleasePolicyTest; do
            if grep -q "$task" /tmp/task7-shared-tasks-macos.txt; then
              echo "✓ $task"
            else
              echo "::error::Missing expected task: $task"
              exit 1
            fi
          done

      # ── Link all four framework binaries ────────────────────────────
      - name: Link all framework binaries
        working-directory: src
        run: |
          ./gradlew --no-daemon \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            :shared:linkReleaseFrameworkIosSimulatorArm64 \
            :shared:linkDebugFrameworkIosArm64 \
            :shared:linkReleaseFrameworkIosArm64

      - name: Verify Mach-O binaries
        working-directory: src
        run: |
          set -euo pipefail
          BINARIES=$(find shared/build/bin -path '*RadioShakeShared.framework/RadioShakeShared' -type f)
          COUNT=$(echo "$BINARIES" | wc -l | tr -d ' ')
          echo "Found $COUNT framework binaries:"
          echo "$BINARIES"

          if [ "$COUNT" -ne 4 ]; then
            echo "::error::Expected 4 framework binaries, got $COUNT"
            exit 1
          fi

          for bin in $BINARIES; do
            FILE_INFO=$(file "$bin")
            echo "$FILE_INFO"
            if ! echo "$FILE_INFO" | grep -q "Mach-O"; then
              echo "::error::$bin is not a Mach-O binary"
              exit 1
            fi
          done

      # ── Audit Obj-C header ──────────────────────────────────────────
      - name: Audit framework header (allow/deny symbols)
        working-directory: src
        run: |
          set -euo pipefail
          # Use the simulator debug header for inspection
          HEADER=$(find shared/build/bin -path '*iosSimulatorArm64/debugFramework/RadioShakeShared.framework/Headers/*.h' -type f | head -1)
          echo "Inspecting header: $HEADER"

          echo ""
          echo "=== Allow-list check ==="
          ALLOW_FAIL=0
          for sym in IosSharedFacade IosStation IosCancellation IosErrorCode; do
            if grep -q "$sym" "$HEADER"; then
              echo "✓ $sym present"
            else
              echo "✗ $sym MISSING"
              ALLOW_FAIL=1
            fi
          done

          echo ""
          echo "=== Deny-list check ==="
          DENY_FAIL=0
          for sym in RadioBrowserApiService ShazamApiService StationDto DatabaseDriverFactory FavouriteRepository StationRepository SongLogRepository; do
            if grep -q "$sym" "$HEADER"; then
              echo "✗ $sym LEAKED into header"
              DENY_FAIL=1
            else
              echo "✓ $sym absent"
            fi
          done

          echo ""
          echo "=== Unavoidable generated symbols (record, not block) ==="
          # SQLDelight generated symbols cannot be hidden; record them
          grep -oE '\b(RadioShakeDatabase|FavouriteQueries|StationQueries|SongLogQueries)\b' "$HEADER" | sort -u | while read -r sym; do
            echo "⚠ Generated symbol present: $sym (expected, unreachable from facade)"
          done || true

          if [ "$ALLOW_FAIL" -ne 0 ] || [ "$DENY_FAIL" -ne 0 ]; then
            echo "::error::Header audit failed"
            exit 1
          fi

          # Save full header for artifact
          cp "$HEADER" /tmp/RadioShakeShared-header.h

      # ── Swift typecheck ─────────────────────────────────────────────
      - name: Swift typecheck against framework
        working-directory: src
        run: |
          set -euo pipefail
          # Write the Swift smoke file
          cat > /tmp/Task7FacadeSmoke.swift << 'SWIFT'
          import Foundation
          import RadioShakeShared

          @MainActor
          final class StationsModel: ObservableObject {
              @Published private(set) var stations: [IosStation] = []
              @Published private(set) var error: IosErrorCode?
              private let shared: IosSharedFacade
              private var search: IosCancellation?
              private var favourites: IosCancellation?

              init(databasePath: String) {
                  shared = IosSharedFacade(baseUrl: "https://de1.api.radio-browser.info",
                      databasePath: databasePath, destructiveRecoveryEnabled: false)
                  favourites = shared.observeFavourites { [weak self] in self?.stations = $0 }
              }
              func search(_ query: String) {
                  search?.cancel()
                  search = shared.searchStations(query: query, limit: 30) { [weak self] values, error in
                      self?.stations = values; self?.error = error
                  }
              }
              func setFavourite(_ station: IosStation, enabled: Bool) {
                  _ = shared.setFavourite(station: station, isFavourite: enabled) { [weak self] in self?.error = $0 }
              }
              deinit { search?.cancel(); favourites?.cancel(); shared.close() }
          }
          SWIFT

          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          FRAMEWORK_PATH="shared/build/bin/iosSimulatorArm64/debugFramework"

          echo "SDK: $SDK_PATH"
          echo "Framework: $FRAMEWORK_PATH"

          xcrun swiftc -typecheck /tmp/Task7FacadeSmoke.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios17.0-simulator \
            -F "$FRAMEWORK_PATH" \
            -framework RadioShakeShared

          echo "✓ Swift typecheck passed"

      # ── iOS simulator tests ─────────────────────────────────────────
      - name: Run iOS simulator debug tests
        working-directory: src
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test

      - name: Run iOS simulator release logging policy tests
        working-directory: src
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64ReleasePolicyTest

      # ── iOS app build + XCTest ──────────────────────────────────────
      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          VERSION="2.42.0"
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mv /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo cp -R /tmp/xcodegen/xcodegen/share/* /usr/local/share/ || true
          xcodegen --version

      - name: Generate Xcode project
        working-directory: src/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project RadioShake.xcodeproj -list

      - name: Build iOS app (simulator, unsigned)
        working-directory: src/ios
        run: |
          set -euo pipefail
          mkdir -p /tmp/derived-data
          xcodebuild build \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Debug \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 15' \
            -derivedDataPath /tmp/derived-data \
            -resultBundlePath /tmp/ios-app-build.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app is unsigned
        run: |
          set -euo pipefail
          APP="/tmp/derived-data/Build/Products/Debug-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::app not found at $APP"; exit 1; }
          if codesign -dv "$APP" 2>&1 | grep -q "code object is not signed"; then
            echo "OK unsigned"
          else
            codesign -dv "$APP" 2>&1
            echo "::error::app should be unsigned but codesign reports otherwise"
            exit 1
          fi

      - name: Run XCTest unit + UI tests
        working-directory: src/ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Debug \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 15' \
            -derivedDataPath /tmp/derived-data \
            -resultBundlePath /tmp/ios-app-test.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Record app bundle checksum
        run: |
          set -euo pipefail
          APP="/tmp/derived-data/Build/Products/Debug-iphonesimulator/RadioShake.app"
          test -d "$APP" || { echo "::error::app not found at $APP"; exit 1; }
          find "$APP" -type f -exec shasum -a 256 {} + \
            | sort -k2 > /tmp/ios-app-bundle-sha256.txt
          shasum -a 256 /tmp/ios-app-bundle-sha256.txt \
            | tee /tmp/ios-app-bundle-digest.txt

      # ── Full regression suite ───────────────────────────────────────
      - name: Run JVM + Android + Wear regression tests
        working-directory: src
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon \
            :shared:jvmTest \
            :shared:testDebugUnitTest \
            :shared:testReleaseUnitTest \
            :app:testDebugUnitTest \
            :wear:testDebugUnitTest

      # ── Record evidence ─────────────────────────────────────────────
      - name: Record validation evidence
        if: always()
        working-directory: src
        run: |
          set -euo pipefail
          echo "=== Validation Evidence ==="
          echo "SHA: $(git rev-parse HEAD)"
          echo "Runner: $(uname -a)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "SDK (device): $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK (simulator): $(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Date: $(date -u)"

          # List test reports
          echo ""
          echo "=== Test Reports ==="
          find shared/build/reports -name '*.xml' -o -name '*.html' 2>/dev/null | head -20 || echo "(none)"

      - name: Post status to Forgejo
        if: always()
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
          HEAD_SHA: ${{ steps.clone.outputs.head_sha || '' }}
          RESULT: ${{ job.status }}
        run: |
          set -eu
          echo "::add-mask::$STATUS_TOKEN"
          echo "::add-mask::$HOST"

          # Derive SHA from src if output was missed
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(git -C src rev-parse HEAD 2>/dev/null || echo "")
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::No HEAD SHA available for status callback"
            exit 0
          fi

          STATE="success"
          if [ "$RESULT" != "success" ]; then STATE="failure"; fi

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: token $STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://${HOST}/api/v1/repos/hiten/RadioShake/statuses/${HEAD_SHA}" \
            -d "{\"state\":\"${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"iOS shared framework validation\",\"context\":\"github/ios-validate\"}" \
          || echo "::warning::Failed to post status to Forgejo"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ios-validate-evidence
          retention-days: 30
          path: |
            /tmp/RadioShakeShared-header.h
            /tmp/Task7FacadeSmoke.swift
            src/shared/build/reports/
            /tmp/ios-app-build.xcresult
            /tmp/ios-app-test.xcresult
            /tmp/ios-app-bundle-sha256.txt
            /tmp/ios-app-bundle-digest.txt
          # NEVER upload source, local.properties, or gradle caches

# iOS per-screen accessibility audits: nightly (gate passes), weekly (full passes) and manual.
#
# The audit classes (A11yAudit*UITests) no longer run in ios-shared-validate. They run here on a
# schedule against Forgejo main, or on demand against any Forgejo branch. Posts a commit status on
# the audited SHA: ios-a11y-nightly, ios-a11y-weekly or ios-a11y (manual). Advisory: nothing in the
# TestFlight gate reads these contexts.
#
# GitHub schedules carry no inputs, so scheduled runs always audit `main` explicitly.

name: ios-a11y-audit

on:
  schedule:
    - cron: '41 1 * * *'
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Forgejo branch to audit'
        default: 'main'
      sha:
        description: 'Expected HEAD SHA (leave empty to audit the branch tip)'
        default: ''
      matrix:
        description: 'gate = default light + AX5 dark bold; full = the five remaining passes on iPhone SE'
        type: choice
        options: [gate, full]
        default: gate

permissions:
  contents: read

# Workflow-level concurrency cannot read job outputs, so the group is keyed on the requested ref.
# Schedules always audit main (the same group); other branches get their own group. Runs queue
# rather than cancel.
concurrency:
  group: ios-a11y-audit-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  SIM_OS: '26.5'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      passes: ${{ steps.resolve.outputs.passes }}
      device: ${{ steps.resolve.outputs.device }}
      context: ${{ steps.resolve.outputs.context }}
    steps:
      - name: Resolve ref, commit, passes and device
        id: resolve
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REF: ${{ inputs.ref || 'main' }}
          EXPECTED_SHA: ${{ inputs.sha || '' }}
          MATRIX_IN: ${{ inputs.matrix || 'gate' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            REF=main
            EXPECTED_SHA=""
            case "$SCHEDULE" in
              "17 5 * * 0") MATRIX=full; CONTEXT=ios-a11y-weekly ;;
              "41 1 * * *") MATRIX=gate; CONTEXT=ios-a11y-nightly ;;
              *) echo "::error::unknown schedule '$SCHEDULE'; update this case together with the on.schedule crons"; exit 1 ;;
            esac
          else
            MATRIX="$MATRIX_IN"; CONTEXT=ios-a11y
          fi
          if ! printf '%s' "$MATRIX" | grep -Eq '^(gate|full)$'; then
            echo "::error::matrix must match ^(gate|full)$"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$' \
             || printf '%s' "$REF" | grep -Eq '\.\.|//|\.lock$|/$'; then
            echo "::error::ref must match a safe branch name"
            exit 1
          fi
          if [ -n "$EXPECTED_SHA" ] && ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase hex commit id"
            exit 1
          fi
          if [ "$MATRIX" = "full" ]; then
            PASSES='["defaultDark","ax5Light","contrastLight","contrastDark","xSmallLight"]'
            DEVICE='iPhone SE (3rd generation)'
          else
            PASSES='["defaultLight","ax5DarkBold"]'
            DEVICE='iPhone 17'
          fi
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOST"
          SHA="$EXPECTED_SHA"
          if [ -z "$SHA" ]; then
            OUT=$(git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              ls-remote "https://${HOST}/hiten/RadioShake.git" "refs/heads/${REF}" 2>/dev/null || true)
            SHA=$(printf '%s\n' "$OUT" | awk -v r="refs/heads/${REF}" '$2 == r { print $1; exit }')
            if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::could not resolve branch $REF to a commit"
              exit 1
            fi
          fi
          {
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "matrix=$MATRIX"
            echo "passes=$PASSES"
            echo "device=$DEVICE"
            echo "context=$CONTEXT"
          } >> "$GITHUB_OUTPUT"
          echo "Auditing $REF at $SHA, matrix=$MATRIX, status context=$CONTEXT"

  audit:
    name: audit (${{ matrix.pass }})
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        pass: ${{ fromJSON(needs.resolve.outputs.passes) }}
    env:
      EVIDENCE_PATHS: |
        /tmp/ios-logs/
        /tmp/a11y-issues/
        /tmp/ios-a11y-${{ matrix.pass }}.xcresult
    steps:
      # ── Clone source from private Forgejo host ──────────────────────
      - name: Clone source from private host
        id: clone
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ needs.resolve.outputs.ref }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOST"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src

          # Verify auth was not persisted
          if grep -rq "AUTHORIZATION" src/.git/config; then
            echo "::error::auth header was persisted in src/.git/config"
            exit 1
          fi

          HEAD_SHA=$(git -C src rev-parse HEAD)

          # TASK-141 AC #4: when an expected SHA is given, the job must
          # validate exactly that commit, not whatever the branch tip is now.
          if [ -n "$EXPECTED_SHA" ]; then
            if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
              echo "Branch tip $HEAD_SHA != expected $EXPECTED_SHA; deepening history"
              # Ancestry needs real history, so unshallow the branch first.
              if [ "$(git -C src rev-parse --is-shallow-repository)" = "true" ]; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --unshallow origin "$REF" \
                  || { echo "::error::could not fetch full history of $REF"; exit 1; }
              fi
              # If the SHA is still unknown locally, try fetching it directly
              # (only succeeds when the server allows fetch-by-SHA).
              if ! git -C src cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --depth 1 origin "$EXPECTED_SHA" 2>/dev/null || true
              fi
              FULL_SHA=$(git -C src rev-parse --verify -q "${EXPECTED_SHA}^{commit}" || true)
              if [ -z "$FULL_SHA" ]; then
                echo "::error::expected SHA $EXPECTED_SHA does not exist in $REF"
                exit 1
              fi
              # The SHA must belong to the branch, not just exist on the host.
              if ! git -C src merge-base --is-ancestor "$FULL_SHA" "origin/$REF"; then
                echo "::error::expected SHA $FULL_SHA is not an ancestor of origin/$REF"
                exit 1
              fi
              git -C src checkout --detach "$FULL_SHA" \
                || { echo "::error::could not check out $FULL_SHA"; exit 1; }
              HEAD_SHA=$(git -C src rev-parse HEAD)
            fi
            if [ "$HEAD_SHA" != "$(git -C src rev-parse --verify "${EXPECTED_SHA}^{commit}")" ]; then
              echo "::error::checked-out $HEAD_SHA does not match expected $EXPECTED_SHA"
              exit 1
            fi
          fi

          # Only record the SHA once it is verified, so report-status never
          # posts success for, or substitutes the branch tip for, a commit
          # the job did not validate (an unverified run leaves the output
          # empty and report-status falls back to the requested SHA).
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Cloned $REF at $HEAD_SHA"

      # A source ref without audit classes (main before A11y-1 merges, old branches) skips the whole build.
      # Reads files only; no secrets, no branch code runs.
      - name: Find audit classes in the source
        id: classes
        run: |
          set -euo pipefail
          N=0
          for f in src/ios/UITests/RadioShakeUITests/A11y/A11yAudit*UITests.swift; do
            [ -f "$f" ] || continue
            N=$((N + $(grep -cE '^final class +A11yAudit[A-Za-z0-9_]*UITests' "$f" || true)))
          done
          if [ "$N" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          echo "$N audit class(es) in this source ref"

      - name: Check out CI scripts (this repo, scripts only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          path: ci
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 21
        if: steps.classes.outputs.present == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'

      # ── macOS preflight (TASK-141 AC #3) ────────────────────────────
      - name: macOS preflight
        if: steps.classes.outputs.present == 'true'
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected arm64, got $ARCH"
            exit 1
          fi

          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is missing; the macos-26 image changed. Update XCODE_APP / SIM_OS in workflow env to the image's versions. Installed:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          mkdir -p /tmp/ios-logs

          echo "=== xcode-select -p ==="
          xcode-select -p
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== uname -m ==="
          echo "$ARCH"
          echo "=== java -version ==="
          java -version
          echo "=== iOS SDK (device) ==="
          xcrun --sdk iphoneos --show-sdk-path
          echo "=== iOS SDK (simulator) ==="
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "=== xcrun simctl list runtimes ==="
          xcrun simctl list runtimes | tee /tmp/simctl-runtimes.txt
          if ! grep -qF "iOS ${SIM_OS} (" /tmp/simctl-runtimes.txt; then
            echo "::error::iOS ${SIM_OS} simulator runtime not installed; update XCODE_APP / SIM_OS in workflow env to the image's versions"
            exit 1
          fi
          echo "=== iPhone 17 simulator under iOS ${SIM_OS} ==="
          xcrun simctl list devices available \
            | awk -v hdr="-- iOS ${SIM_OS} --" '$0 == hdr {f=1; next} /^-- /{f=0} f' \
            | grep -F "iPhone 17 (" \
            || { echo "::error::no iPhone 17 simulator under iOS ${SIM_OS}; update XCODE_APP / SIM_OS in workflow env to the image's versions"; exit 1; }

      # ── iOS app build + XCTest ──────────────────────────────────────
      - name: Install XcodeGen (pinned)
        if: steps.classes.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION="2.42.0"
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mv /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo cp -R /tmp/xcodegen/xcodegen/share/* /usr/local/share/ || true
          xcodegen --version

      # Only the Debug XCFramework: this job builds and tests the Debug app. The Xcode
      # preBuildScript re-runs the (cached) Gradle task and re-points the symlink itself.
      - name: Assemble shared Debug XCFramework and point symlink at it
        if: steps.classes.outputs.present == 'true'
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:assembleRadioShakeSharedDebugXCFramework
          test -d "shared/build/XCFrameworks/debug/RadioShakeShared.xcframework" \
            || { echo "::error::debug XCFramework not produced"; exit 1; }
          mkdir -p shared/build/XCFrameworks/current
          rm -rf shared/build/XCFrameworks/current/RadioShakeShared.xcframework
          ln -sfn "$PWD/shared/build/XCFrameworks/debug/RadioShakeShared.xcframework" \
                  "$PWD/shared/build/XCFrameworks/current/RadioShakeShared.xcframework"

      - name: Generate Xcode project
        if: steps.classes.outputs.present == 'true'
        working-directory: src/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project RadioShake.xcodeproj -list

      - name: Boot simulator
        if: steps.classes.outputs.present == 'true'
        env:
          DEVICE: ${{ needs.resolve.outputs.device }}
        run: |
          set -euo pipefail
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${SIM_OS//./-}"
          export RUNTIME_ID
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)["devices"]
          name = os.environ["DEVICE"]
          match = [x["udid"] for x in d.get(os.environ["RUNTIME_ID"], []) if x["name"] == name]
          print(match[0] if match else "")')
          if [ -z "$UDID" ]; then
            # The image may not ship this device: create it from the device type and the
            # pinned runtime, failing clearly when the device type is unavailable.
            TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, os, sys
          name = os.environ["DEVICE"]
          match = [x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"] == name]
          print(match[0] if match else "")')
            if [ -z "$TYPE_ID" ]; then
              echo "::error::no simulator named '$DEVICE' under iOS ${SIM_OS} and no such device type on this image"
              exit 1
            fi
            UDID=$(xcrun simctl create "RadioShake $DEVICE" "$TYPE_ID" "$RUNTIME_ID") \
              || { echo "::error::could not create a '$DEVICE' simulator for iOS ${SIM_OS}"; exit 1; }
          fi
          [[ "$UDID" =~ ^[0-9A-F-]{36}$ ]] || { echo "::error::unexpected simulator id"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run accessibility audit passes
        if: steps.classes.outputs.present == 'true'
        working-directory: src/ios
        env:
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          PASS: ${{ matrix.pass }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ios-logs /tmp/a11y-issues
          rm -f /tmp/a11y-only-args.txt
          printf '%s' "$PASS" | grep -Eq '^[A-Za-z0-9]+$' || { echo "::error::unexpected pass name"; exit 1; }
          if [ "$MATRIX" = "full" ]; then PREFIX=testFull; else PREFIX=testGate; fi
          CAP="$(printf '%s' "${PASS:0:1}" | tr '[:lower:]' '[:upper:]')${PASS:1}"
          METHOD="${PREFIX}${CAP}"
          ONLY=()
          for f in UITests/RadioShakeUITests/A11y/A11yAudit*UITests.swift; do
            [ -f "$f" ] || continue
            for c in $(grep -hoE '^final class +A11yAudit[A-Za-z0-9_]*UITests' "$f" | awk '{print $3}'); do
              ONLY+=("-only-testing:RadioShakeUITests/$c/$METHOD")
            done
          done
          if [ "${#ONLY[@]}" -eq 0 ]; then
            echo "No A11yAudit*UITests classes in this source ref, skipping"
            exit 0
          fi
          printf '%s\n' "${ONLY[@]}" > /tmp/a11y-only-args.txt
          if [ "$MATRIX" = "full" ]; then
            export TEST_RUNNER_RS_A11Y_MATRIX=full
          fi
          # No xcodebuild retries: audit findings are deterministic and a retry doubles the time.
          xcodebuild test \
            -project RadioShake.xcodeproj \
            -scheme RadioShake \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath /tmp/derived-data \
            -resultBundlePath "/tmp/ios-a11y-${PASS}.xcresult" \
            "${ONLY[@]}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/ios-logs/xctest.log

      # A leg is green only if every selected audit method ran and was not skipped (xcodebuild exits 0
      # when tests skip or an -only-testing identifier matches nothing). CI-owned script.
      - name: Verify every selected audit test ran
        if: success() && steps.classes.outputs.present == 'true'
        run: |
          if [ ! -f /tmp/a11y-only-args.txt ]; then echo "No audit tests were selected (old source ref), nothing to verify"; exit 0; fi
          python3 ci/.github/scripts/check_shard_ran.py --args /tmp/a11y-only-args.txt --log /tmp/ios-logs/xctest.log

      - name: Summarise audit issues
        if: always()
        run: |
          mkdir -p /tmp/a11y-issues
          grep -hF 'error: -[RadioShakeUITests.A11yAudit' /tmp/ios-logs/xctest.log > /tmp/a11y-issues/issues.txt 2>/dev/null || true
          echo "$(wc -l < /tmp/a11y-issues/issues.txt | tr -d ' ') audit issue line(s)"

      # Nothing uploaded may contain the Forgejo tokens (raw, or the base64
      # basic-auth value the clone step builds). xcresult blobs are
      # zstd-compressed, so a token-free step first decompresses them into
      # /tmp/scan-decompressed (it may use Homebrew's zstd; it holds no secrets).
      - name: Decompress evidence for the secret scan
        if: always()
        run: |
          set +e -u -o pipefail
          NEED=0
          while IFS= read -r p; do
            case "$p" in *.xcresult) [ -e "$p" ] && NEED=1 ;; esac
          done <<< "$EVIDENCE_PATHS"
          if [ "$NEED" = 1 ] && ! command -v zstd >/dev/null 2>&1; then
            brew install zstd >/dev/null 2>&1
          fi
          python3 - <<'PY'
          import json, os, subprocess, shutil

          MAGIC = b"\x28\xb5\x2f\xfd"
          zstd = shutil.which("zstd")
          out = "/tmp/scan-decompressed"
          os.makedirs(out, exist_ok=True)
          items, failed, n = [], [], 0
          for p in [x.strip() for x in os.environ["EVIDENCE_PATHS"].splitlines() if x.strip()]:
              if not os.path.exists(p):
                  continue
              is_bundle = p.rstrip("/").endswith(".xcresult")
              files = []
              if os.path.isdir(p):
                  for root, _, names in os.walk(p):
                      files += [os.path.join(root, f) for f in names]
              else:
                  files = [p]
              for f in files:
                  label = p if is_bundle else f
                  try:
                      with open(f, "rb") as fh:
                          data = fh.read()
                  except OSError:
                      continue  # the scan step reports unreadable files
                  if not data.startswith(MAGIC):
                      continue
                  if zstd is None:
                      failed.append(label + " (decompressor unavailable)")
                      continue
                  r = subprocess.run([zstd, "-dcq"], input=data, capture_output=True)
                  if r.returncode != 0:
                      failed.append(label + " (decompress failed)")
                      continue
                  n += 1
                  dest = os.path.join(out, str(n))
                  with open(dest, "wb") as fh:
                      fh.write(r.stdout)
                  items.append({"label": label, "file": dest, "source": f})
          with open(os.path.join(out, "manifest.json"), "w") as fh:
              json.dump({"items": items, "failed": failed}, fh)
          print(f"Decompressed {len(items)} blobs, {len(failed)} failures")
          PY

      # Holds the Forgejo tokens and runs after branch code, so it uses only system tools by
      # absolute path, a fixed PATH, a bash that ignores BASH_ENV (-p) and an allowlisted
      # interpreter environment (env -i). Fails closed: unreadable files or a missing/failed
      # decompression fail the step. Prints paths only.
      # This narrows env/PATH hijacks; it is not a hard boundary against same-user file
      # tampering or sudo.
      - name: Secret scan of evidence artifacts
        id: secret_scan
        if: always()
        shell: /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          FORGEJO_CLONE_TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          FORGEJO_STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
        run: |
          PATH=/usr/bin:/bin:/usr/sbin:/sbin; export PATH
          unset DEVELOPER_DIR BASH_ENV ENV PYTHONPATH PYTHONHOME PYTHONSTARTUP
          set +e -u -o pipefail
          trap '/bin/rm -rf /tmp/scan-decompressed' EXIT
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" EVIDENCE_PATHS="$EVIDENCE_PATHS" \
            FORGEJO_CLONE_TOKEN="$FORGEJO_CLONE_TOKEN" FORGEJO_STATUS_TOKEN="$FORGEJO_STATUS_TOKEN" \
            /usr/bin/python3 -I - <<'PY'
          import base64, json, os, sys

          needles = {}
          for name in ("FORGEJO_CLONE_TOKEN", "FORGEJO_STATUS_TOKEN"):
              v = os.environ.get(name, "")
              if v:
                  needles[name] = v.encode()
          clone = os.environ.get("FORGEJO_CLONE_TOKEN", "")
          if clone:
              needles["CLONE_AUTH_BASE64"] = base64.b64encode(b"oauth2:" + clone.encode())

          leaked, failed, scanned_files, scanned_paths = [], [], 0, 0
          have_bundle = False
          magic_files = []

          def check(label, data):
              for n, v in needles.items():
                  if v in data:
                      leaked.append((n, label))

          for p in [x.strip() for x in os.environ["EVIDENCE_PATHS"].splitlines() if x.strip()]:
              if not os.path.exists(p):
                  continue
              scanned_paths += 1
              is_bundle = p.rstrip("/").endswith(".xcresult")
              have_bundle = have_bundle or is_bundle
              files = []
              if os.path.isdir(p):
                  for root, _, names in os.walk(p):
                      files += [os.path.join(root, n) for n in names]
              else:
                  files = [p]
              for f in files:
                  label = p if is_bundle else f
                  try:
                      with open(f, "rb") as fh:
                          data = fh.read()
                  except OSError:
                      failed.append(label)
                      continue
                  scanned_files += 1
                  check(label, data)
                  if data.startswith(b"\x28\xb5\x2f\xfd"):
                      magic_files.append((f, label))

          decompressed = 0
          manifest = "/tmp/scan-decompressed/manifest.json"
          try:
              with open(manifest, "r") as fh:
                  m = json.load(fh)
              for item in m["items"]:
                  try:
                      with open(item["file"], "rb") as fh:
                          check(item["label"], fh.read())
                      decompressed += 1
                  except OSError:
                      failed.append(item["label"] + " (decompressed copy unreadable)")
              failed.extend(m["failed"])
              listed = set(i.get("source") for i in m["items"])
          except (OSError, ValueError, KeyError):
              listed = set()
              if have_bundle:
                  failed.append("xcresult evidence (decompression manifest missing)")
          for f, label in magic_files:
              if f not in listed and not any(label in x for x in failed):
                  failed.append(label + " (compressed blob not in decompression manifest)")

          print(f"Scanned {scanned_paths} evidence paths, {scanned_files} files, {decompressed} decompressed blobs; {len(needles)} needles")
          for n, label in sorted(set(leaked)):
              print(f"::error::{n} value found in {label}")
          for label in sorted(set(failed)):
              print(f"::error::could not scan {label}")
          if leaked or failed:
              print("::error::secret scan failed; artifacts will not be uploaded")
              sys.exit(1)
          print("OK - no secret values in evidence artifacts")
          PY

      - name: Upload evidence
        if: always() && steps.clone.outcome == 'success' && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ios-a11y-evidence-${{ matrix.pass }}
          retention-days: 30
          if-no-files-found: warn
          # NEVER upload source, local.properties, gradle caches or app bundles
          path: |
            /tmp/ios-logs/
            /tmp/ios-a11y-${{ matrix.pass }}.xcresult

      - name: Upload issue summary
        if: always() && steps.clone.outcome == 'success' && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ios-a11y-issues-${{ matrix.pass }}
          retention-days: 30
          if-no-files-found: warn
          path: /tmp/a11y-issues/issues.txt

  report:
    needs: [resolve, audit]
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post status to Forgejo
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          CONTEXT: ${{ needs.resolve.outputs.context }}
          MATRIX: ${{ needs.resolve.outputs.matrix }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -u
          echo "::add-mask::$STATUS_TOKEN"
          echo "::add-mask::$HOST"
          if [ -z "$HEAD_SHA" ] || [ -z "$CONTEXT" ]; then
            echo "::warning::no resolved commit, not posting a status"
            exit 0
          fi
          STATE="failure"
          if [ "$AUDIT_RESULT" = "success" ]; then STATE="success"; fi
          POSTED=0
          for ATTEMPT in 1 2 3; do
            if curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: token $STATUS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${HOST}/api/v1/repos/hiten/RadioShake/statuses/${HEAD_SHA}" \
              -d "{\"state\":\"${STATE}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"iOS accessibility audit (${MATRIX}: ${AUDIT_RESULT})\",\"context\":\"${CONTEXT}\"}"; then
              POSTED=1
              break
            fi
            echo "::warning::status POST attempt ${ATTEMPT}/3 failed"
            if [ "$ATTEMPT" -lt 3 ]; then sleep 5; fi
          done
          if [ "$POSTED" -ne 1 ]; then
            echo "::warning::could not post the status to Forgejo; the audit result stands in this run"
          fi
          exit 0

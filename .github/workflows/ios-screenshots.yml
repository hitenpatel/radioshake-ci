# Screenshot tour (V1/V2 visual review) — PRIVATE OUTPUT.
#
# This repo is public, so its artifacts are public. The tour's PNGs are
# never uploaded in clear: they are tarred and encrypted with a random
# AES-256 key, and that key is encrypted to the RSA public key in
# .github/screenshots-pub.pem. Only the owner's VM holds the private key.
# The plaintext PNGs and the result bundle are deleted before upload, and
# nothing from this job is posted to Forgejo.

name: ios-screenshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Forgejo branch to clone'
        required: true
      sha:
        description: 'Expected HEAD SHA (leave empty to skip check)'
        default: ''

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  SIM_OS: '26.5'

jobs:
  tour:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      head_sha: ${{ steps.clone.outputs.head_sha }}
    steps:
      - name: Check out this repo (public key only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          path: ci
          sparse-checkout: .github/screenshots-pub.pem
          sparse-checkout-cone-mode: false

      - name: Clone source from private host
        id: clone
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ inputs.ref || github.event.client_payload.ref || 'feat/task-7-ios-shared-framework' }}
          EXPECTED_SHA: ${{ inputs.sha || github.event.client_payload.sha || '' }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$HOST"

          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src

          # Verify auth was not persisted
          if grep -rq "AUTHORIZATION" src/.git/config; then
            echo "::error::auth header was persisted in src/.git/config"
            exit 1
          fi

          HEAD_SHA=$(git -C src rev-parse HEAD)

          # TASK-141 AC #4: when an expected SHA is given, the job must
          # validate exactly that commit, not whatever the branch tip is now.
          if [ -n "$EXPECTED_SHA" ]; then
            if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
              echo "Branch tip $HEAD_SHA != expected $EXPECTED_SHA; deepening history"
              # Ancestry needs real history, so unshallow the branch first.
              if [ "$(git -C src rev-parse --is-shallow-repository)" = "true" ]; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --unshallow origin "$REF" \
                  || { echo "::error::could not fetch full history of $REF"; exit 1; }
              fi
              # If the SHA is still unknown locally, try fetching it directly
              # (only succeeds when the server allows fetch-by-SHA).
              if ! git -C src cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
                git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  fetch --depth 1 origin "$EXPECTED_SHA" 2>/dev/null || true
              fi
              FULL_SHA=$(git -C src rev-parse --verify -q "${EXPECTED_SHA}^{commit}" || true)
              if [ -z "$FULL_SHA" ]; then
                echo "::error::expected SHA $EXPECTED_SHA does not exist in $REF"
                exit 1
              fi
              # The SHA must belong to the branch, not just exist on the host.
              if ! git -C src merge-base --is-ancestor "$FULL_SHA" "origin/$REF"; then
                echo "::error::expected SHA $FULL_SHA is not an ancestor of origin/$REF"
                exit 1
              fi
              git -C src checkout --detach "$FULL_SHA" \
                || { echo "::error::could not check out $FULL_SHA"; exit 1; }
              HEAD_SHA=$(git -C src rev-parse HEAD)
            fi
            if [ "$HEAD_SHA" != "$(git -C src rev-parse --verify "${EXPECTED_SHA}^{commit}")" ]; then
              echo "::error::checked-out $HEAD_SHA does not match expected $EXPECTED_SHA"
              exit 1
            fi
          fi

          # Only record the SHA once it is verified, so report-status never
          # posts success for, or substitutes the branch tip for, a commit
          # the job did not validate (an unverified run leaves the output
          # empty and report-status falls back to the requested SHA).
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Cloned $REF at $HEAD_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Select Xcode
        run: |
          set -euo pipefail
          test -d "$XCODE_APP" || { echo "::error::$XCODE_APP missing"; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          VERSION="2.42.0"
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo mv /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          sudo cp -R /tmp/xcodegen/xcodegen/share/* /usr/local/share/ || true
          xcodegen --version

      - name: Assemble shared XCFramework (Debug)
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shared:assembleRadioShakeSharedDebugXCFramework
          mkdir -p shared/build/XCFrameworks/current
          ln -sfn "$PWD/shared/build/XCFrameworks/debug/RadioShakeShared.xcframework" \
                  "$PWD/shared/build/XCFrameworks/current/RadioShakeShared.xcframework"

      - name: Generate Xcode project
        working-directory: src/ios
        run: xcodegen generate --spec project.yml

      - name: Boot simulator with a fixed status bar
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)["devices"]
          key = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIM_OS"].replace(".", "-")
          print(next(x["udid"] for x in d.get(key, []) if x["name"] == "iPhone 17"))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 09:41 --batteryState charged \
            --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Run screenshot tour
        working-directory: src/ios
        run: |
          set -euo pipefail
          set +e
          xcodebuild test \
            -project RadioShake.xcodeproj -scheme RadioShake -configuration Debug \
            -destination "id=$UDID" -derivedDataPath /tmp/derived-data \
            -only-testing:RadioShakeUITests/ScreenshotTourUITests \
            -resultBundlePath /tmp/rs-shots.xcresult \
            CODE_SIGNING_ALLOWED=NO > /tmp/tour.log 2>&1
          RC=$?
          set -e
          grep -E "error:|Test Case .* failed|\*\* TEST (SUCCEEDED|FAILED)|Executed [0-9]+ tests" /tmp/tour.log | sort -u | tail -40
          echo "TOUR_RC=$RC" >> "$GITHUB_ENV"

      - name: Export and encrypt screenshots, delete plaintext
        if: always()
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$OPENSSL" ] || { brew install openssl@3 >/dev/null; OPENSSL="$(brew --prefix openssl@3)/bin/openssl"; }
          mkdir -p /tmp/rs-shots /tmp/rs-enc
          if [ -d /tmp/rs-shots.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/rs-shots.xcresult --output-path /tmp/rs-shots >/dev/null
          fi
          echo "${TOUR_RC:-1}" > /tmp/rs-shots/tour-exit-code.txt
          tar -czf /tmp/rs-shots.tgz -C /tmp/rs-shots .
          "$OPENSSL" rand -hex 32 > /tmp/rs-key.hex
          "$OPENSSL" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/rs-key.hex \
            -in /tmp/rs-shots.tgz -out /tmp/rs-enc/shots.tgz.enc
          "$OPENSSL" pkeyutl -encrypt -pubin -inkey ci/.github/screenshots-pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/rs-key.hex -out /tmp/rs-enc/key.enc
          rm -rf /tmp/rs-key.hex /tmp/rs-shots.tgz /tmp/rs-shots /tmp/rs-shots.xcresult
          ls -la /tmp/rs-enc

      - name: Upload encrypted screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ios-screenshots-encrypted
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/rs-enc/shots.tgz.enc
            /tmp/rs-enc/key.enc

      - name: Fail if the tour failed
        run: test "${TOUR_RC:-1}" = 0

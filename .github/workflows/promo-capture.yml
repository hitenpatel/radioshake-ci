name: promo-capture

# Records promo-video flows (.maestro/marketing/video/<flow>.yaml) as screen recordings on the
# emulator, so promo footage never needs the owner's daily-driver phone. This repo is PUBLIC, so the
# recordings are never uploaded in clear: they are tarred and encrypted with a random AES-256 key,
# and that key is encrypted to the RSA public key in .github/screenshots-pub.pem (same scheme as
# ios-screenshots.yml). Only the encrypted pair is uploaded, kept for one day.

on:
  workflow_dispatch:
    inputs:
      flows:
        description: Space-separated flow names from .maestro/marketing/video/ (e.g. "v312-golive v311-languages")
        required: true
      ref:
        description: Source ref to clone (Forgejo branch or tag)
        default: main

permissions:
  contents: read

concurrency:
  group: promo-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out this repo (public key only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          path: ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Clone source from private host
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src
          ! grep -rq "AUTHORIZATION" src/.git/config
          git -C src log -1 --format='source %h %s'

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 36 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: "2.8.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: src
        env:
          PODCAST_INDEX_API_KEY: ${{ secrets.PODCAST_INDEX_API_KEY }}
          PODCAST_INDEX_API_SECRET: ${{ secrets.PODCAST_INDEX_API_SECRET }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'podcastIndex.apiKey=%s\n' "$PODCAST_INDEX_API_KEY" >> local.properties
          printf 'podcastIndex.apiSecret=%s\n' "$PODCAST_INDEX_API_SECRET" >> local.properties
          ./gradlew :app:assembleDebug

      - name: Record flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FLOWS: ${{ inputs.flows }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          cores: 4
          ram-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -noaudio
          script: >-
            cd src && bash ci/promo-capture-emulator.sh

      - name: Encrypt recordings, delete plaintext
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/rs-enc src/promo-captures
          tar -czf /tmp/rs-promo.tgz -C src/promo-captures .
          openssl rand -hex 32 > /tmp/rs-key.hex
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/rs-key.hex \
            -in /tmp/rs-promo.tgz -out /tmp/rs-enc/promo.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey ci/.github/screenshots-pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/rs-key.hex -out /tmp/rs-enc/key.enc
          rm -rf /tmp/rs-key.hex /tmp/rs-promo.tgz src/promo-captures
          ls -la /tmp/rs-enc

      - name: Upload encrypted recordings only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: promo-captures-encrypted
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/rs-enc/promo.tgz.enc
            /tmp/rs-enc/key.enc

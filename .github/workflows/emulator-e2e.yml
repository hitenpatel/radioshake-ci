name: emulator-e2e

on:
  schedule:
    # 23:30 UTC — the emulator nightly and the Forgejo device nightly (01:00 UTC)
    # both land on the same calendar date when SUITE_ID uses +6h offset.
    #
    # TASK-126: GitHub's own schedule cron is best-effort — of the last 3
    # ticks (2026-08-26/27) one fired 15 min late, one fired 5 hours late,
    # one never fired. The primary trigger is now a `radioshake-nightly`
    # repository_dispatch sent by a Forgejo-scheduled workflow at 23:25 UTC
    # (punctual VM cron; see nightly-emulator-dispatch.yml in
    # RadioShake-promo). This schedule cron STAYS as a backup for when the
    # Forgejo dispatch bridge itself fails — the skip-gate below already
    # treats a late/duplicate schedule tick as a no-op once the newest
    # dashboard suite has already passed both halves at the current Forgejo
    # HEAD, so leaving this cron enabled is safe even when the dispatch
    # fires correctly.
    - cron: '30 23 * * *'

  workflow_dispatch:
    inputs:
      tier:
        description: >-
          Tier to run. Use 'nightly' to run the full emulator tier set (same as
          the 23:30 cron, useful for manual end-to-end verification).
        type: choice
        options:
          - nightly
          - tier1-smoke
          - tier2-features
          - tier3-deep
          - r8check
          - auto-instrumentation
          - i18n
        default: tier1-smoke
      ref:
        description: Source ref to clone (Forgejo branch or tag)
        default: main
      suite_id:
        description: >-
          Force a specific SUITE_ID (for pipeline verification runs only).
          Leave empty for normal ungrouped manual dispatches.
        default: ''
      upload_apks:
        description: >-
          Also publish the built APKs to the Forgejo package registry, as the
          23:30 cron (and the Forgejo-triggered radioshake-nightly dispatch)
          does. Use to refresh the device nightly's `latest` pointer on
          demand (e.g. after a registry-auth fix or a stale pointer).
        type: boolean
        default: false

  repository_dispatch:
    # radioshake-main-check: push-to-main bridge (dispatched by pr-checks.yml's
    #   dispatch-to-github job in the Forgejo repo). Unchanged full-tier check;
    #   posts a Forgejo commit status back (see the forgejo-status job below).
    # radioshake-nightly: TASK-126 — Forgejo-scheduled nightly dispatch
    #   (nightly-emulator-dispatch.yml in RadioShake-promo, 23:25 UTC). Treated
    #   identically to the `schedule` event everywhere in this workflow (see
    #   the NIGHTLY expression on the skip-gate/e2e/publish jobs below) EXCEPT
    #   it does not trigger the forgejo-status push-check callback.
    types: [radioshake-main-check, radioshake-nightly]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Skip-gate: check whether HEAD has already been tested green this suite.
  # Only actually skips on scheduled runs — all other events pass through.
  # Fail open: any lookup error → should_skip=false so coverage is never lost.
  # ──────────────────────────────────────────────────────────────────────────
  skip-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # TASK-126: radioshake-nightly repository_dispatch behaves exactly like
    # `schedule` for skip-gate purposes — whichever of the two fires second
    # at the same Forgejo HEAD sees the newest suite already passed and
    # skips. Plain workflow_dispatch and radioshake-main-check are excluded
    # (they always run). github.event.action carries the event_type for
    # repository_dispatch events.
    env:
      NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'radioshake-nightly') }}
    outputs:
      should_skip: ${{ steps.gate.outputs.should_skip }}
    steps:
      - name: Evaluate skip condition
        id: gate
        env:
          E2E_INGEST_URL: ${{ secrets.E2E_INGEST_URL }}
          E2E_INGEST_TOKEN: ${{ secrets.E2E_INGEST_TOKEN }}
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # Only schedule and radioshake-nightly (NIGHTLY=true) evaluate the
          # skip condition; all other events always run.
          if [ "$NIGHTLY" != "true" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::event=$EVENT (nightly=$NIGHTLY) — skip-gate bypassed"
            exit 0
          fi

          # Fail-open wrapper: any error → run the suite.
          fail_open() {
            echo "::warning::skip-gate lookup failed: $1 — running suite (fail open)"
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Get current Forgejo HEAD sha for the default branch.
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          FORGEJO_HEAD=$(curl -sf --max-time 10 \
            -H "AUTHORIZATION: basic $AUTH" \
            "https://${HOST}/api/v1/repos/hiten/RadioShake/branches/main" \
            2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['commit']['id'])" \
            2>/dev/null) || fail_open "Forgejo HEAD lookup"
          export FORGEJO_HEAD
          echo "Forgejo HEAD: $FORGEJO_HEAD"

          # Query dashboard for recent suites.
          SUITES=$(curl -sf --max-time 10 \
            -H "Authorization: Bearer $E2E_INGEST_TOKEN" \
            "${E2E_INGEST_URL}/v1/suites?project=radioshake&limit=10" \
            2>/dev/null) || fail_open "dashboard suites lookup"

          # Parse: find newest suite; skip only when:
          #   - newest suite status == "passed"
          #   - suite has BOTH halves (emulator + device)
          #   - suite commit_sha == Forgejo HEAD
          #
          # One-half-passed never skips to prevent unpaired-halves drift.
          SKIP=$(echo "$SUITES" | python3 - <<'PY'
          import json, sys, os
          try:
              suites = json.load(sys.stdin)
              if not suites:
                  print("false"); sys.exit(0)
              newest = suites[0]
              forgejo_head = os.environ.get("FORGEJO_HEAD", "")
              sha_match = newest.get("commit_sha", "") == forgejo_head
              status_pass = newest.get("status") == "passed"
              halves = {r.get("half") for r in newest.get("runs", [])}
              both_halves = "emulator" in halves and "device" in halves
              if sha_match and status_pass and both_halves:
                  print("true")
              else:
                  print("false")
          except Exception as e:
              print("false", file=sys.stderr)
              print("false")
          PY
          ) || fail_open "suite parse error"

          echo "should_skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice::Skipping nightly — newest suite passed both halves at Forgejo HEAD $FORGEJO_HEAD"
          else
            echo "::notice::Running nightly — suite not yet complete or HEAD changed"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Main E2E job
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    needs: [skip-gate]
    # Run unless the skip-gate explicitly said to skip.
    # When skip-gate was bypassed (non-schedule event), its output is "false" → always runs.
    if: needs.skip-gate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    # 150 min for full nightly set (cron, repository_dispatch, or manual nightly tier).
    # 90 min for manual single-tier dispatches.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.tier == 'nightly') && 150 || 90 }}

    # TASK-126: single source of truth for "this run should behave like the
    # nightly schedule tick" — true for the schedule cron itself and for the
    # radioshake-nightly repository_dispatch, false for radioshake-main-check
    # and plain workflow_dispatch. Used below wherever behaviour previously
    # branched on github.event_name == 'schedule' alone.
    env:
      NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'radioshake-nightly') }}

    outputs:
      commit_sha: ${{ steps.clone.outputs.commit_sha }}
      commit_msg: ${{ steps.clone.outputs.commit_msg }}
      tier_exit:  ${{ steps.run-tier.outputs.tier_exit }}

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # Clone at the explicit sha for repository_dispatch; at the specified ref otherwise.
      # Note: git clone --branch does not accept a raw SHA — only ref names (branches/tags).
      # For repository_dispatch we clone main (default), then verify HEAD matches the
      # requested sha so we never silently test a different commit.
      # TASK-126: radioshake-nightly reuses this unchanged — same event_name,
      # same client_payload.sha shape as radioshake-main-check.
      - name: Clone source from private host
        id: clone
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.ref || 'main' }}
          WANTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
        run: |
          set -eu
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"

          clone_repo() {
            rm -rf src
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src
            ACTUAL_SHA=$(git -C src rev-parse HEAD)
          }

          # Deepens the already-cloned src's history and checks whether WANTED_SHA
          # is an ancestor of the current HEAD. set -eu safe: the merge-base exit
          # status is only ever observed via the enclosing `if`, never left bare.
          check_ancestor() {
            git -C src -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              fetch --deepen 50 origin main
            if git -C src merge-base --is-ancestor "$WANTED_SHA" HEAD; then
              return 0
            else
              return 1
            fi
          }

          clone_repo

          # For repository_dispatch: verify HEAD is the requested sha.
          # If the push triggered this workflow, main should already be at the wanted sha.
          # A mismatch can also mean the dispatch raced a later push — in that case
          # WANTED_SHA is an ancestor of the newer HEAD and it's safe to test HEAD
          # instead. Only fail hard once neither an exact match nor an ancestor
          # relationship shows up after a few retries (main may just not have
          # replicated the push yet).
          if [ -n "$WANTED_SHA" ] && [ "$ACTUAL_SHA" != "$WANTED_SHA" ]; then
            RESOLVED=0
            for ATTEMPT in 1 2 3; do
              echo "Cloned sha $ACTUAL_SHA != requested $WANTED_SHA (attempt $ATTEMPT/3) — deepening to check ancestry"
              if check_ancestor; then
                echo "::notice::Requested sha $WANTED_SHA is an ancestor of HEAD $ACTUAL_SHA — testing the newer HEAD (dispatch raced a later push)"
                RESOLVED=1
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "Not an ancestor yet; main may not have replicated the push. Retrying clone in 20s..."
                sleep 20
                clone_repo
                if [ "$ACTUAL_SHA" = "$WANTED_SHA" ]; then
                  RESOLVED=1
                  break
                fi
              fi
            done
            if [ "$RESOLVED" -ne 1 ]; then
              echo "::error::Cloned sha $ACTUAL_SHA != requested $WANTED_SHA after 3 attempts (main may not yet include the push)"
              exit 1
            fi
          fi
          COMMIT_MSG=$(git -C src log -1 --pretty=%s)
          echo "commit_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          # Fail-fast: auth must not be persisted to .git/config.
          ! grep -rq "AUTHORIZATION" src/.git/config

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 36 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: "2.8.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build debug APK + androidTest APK
        id: build
        working-directory: src
        env:
          PODCAST_INDEX_API_KEY: ${{ secrets.PODCAST_INDEX_API_KEY }}
          PODCAST_INDEX_API_SECRET: ${{ secrets.PODCAST_INDEX_API_SECRET }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          # Inject Podcast Index credentials so podcast-dependent Maestro flows can
          # authenticate via the proxy. Values come from repository secrets and are
          # written through env vars (never inline ${{ secrets.* }} in run bodies).
          printf 'podcastIndex.apiKey=%s\n' "$PODCAST_INDEX_API_KEY" >> local.properties
          printf 'podcastIndex.apiSecret=%s\n' "$PODCAST_INDEX_API_SECRET" >> local.properties
          # assembleDebugAndroidTest implies assembleDebug; both tasks run in one invocation.
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "test_apk_path=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> "$GITHUB_OUTPUT"

      # Compute SHA-256 of both APKs for immutable-upload verification.
      - name: Compute APK checksums
        # Must match the upload step's condition: the upload sends these .sha256
        # files, so gating them differently makes a dispatch upload fail with
        # curl exit 26 (cannot read local file).
        if: env.NIGHTLY == 'true' || inputs.upload_apks
        id: apk-sha
        working-directory: src
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            | awk '{print $1}' > app-debug.apk.sha256
          echo "checksum=$(cat app-debug.apk.sha256)" >> "$GITHUB_OUTPUT"
          sha256sum app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            | awk '{print $1}' > app-debug-androidTest.apk.sha256
          echo "test_checksum=$(cat app-debug-androidTest.apk.sha256)" >> "$GITHUB_OUTPUT"

      # Run the tier(s):
      #   - scheduled / repository_dispatch (both radioshake-main-check and
      #     radioshake-nightly, TASK-126) → TIER=nightly (full emulator set)
      #   - workflow_dispatch                                → TIER=inputs.tier (single tier)
      - name: Run tier(s) on emulator
        id: run-tier
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'nightly' || inputs.tier }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          # The emulator runner executes each YAML line as a separate /usr/bin/sh -c
          # invocation, so a plain 'cd src' would not persist. Use a single-line script
          # that chains all commands in one shell process.
          script: >-
            cd src &&
            bash ci/emulator-tier.sh;
            TIER_EXIT=$?;
            echo "tier_exit=$TIER_EXIT" >> "$GITHUB_OUTPUT";
            exit "$TIER_EXIT"

      # ── APK handoff to Forgejo generic package registry (scheduled only) ──
      # Uploads both the debug APK and the androidTest APK (for device-only
      # @DeviceOnly instrumentation tests that run on the Forgejo device nightly).
      # Immutable version per sha; if 409 (already exists), verify checksum.
      # Then update the `latest` pointer object.
      - name: Upload APKs to Forgejo package registry
        if: env.NIGHTLY == 'true' || inputs.upload_apks
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          PKG_TOKEN: ${{ secrets.FORGEJO_PKG_TOKEN }}
          COMMIT_SHA: ${{ steps.clone.outputs.commit_sha }}
          CHECKSUM: ${{ steps.apk-sha.outputs.checksum }}
          TEST_CHECKSUM: ${{ steps.apk-sha.outputs.test_checksum }}
        run: |
          set -eu
          echo "::add-mask::$PKG_TOKEN"
          APK_SRC="src/app/build/outputs/apk/debug/app-debug.apk"
          SHA256_SRC="src/app-debug.apk.sha256"
          TEST_APK_SRC="src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          TEST_SHA256_SRC="src/app-debug-androidTest.apk.sha256"

          # Forgejo generic package PUT:
          #   /api/packages/<owner>/generic/<package-name>/<version>/<filename>
          PKG_BASE="https://${HOST}/api/packages/hiten/generic/radioshake-nightly"
          PKG_URL="${PKG_BASE}/${COMMIT_SHA}/app-debug.apk"
          SHA_URL="${PKG_BASE}/${COMMIT_SHA}/app-debug.apk.sha256"
          TEST_PKG_URL="${PKG_BASE}/${COMMIT_SHA}/app-debug-androidTest.apk"
          TEST_SHA_URL="${PKG_BASE}/${COMMIT_SHA}/app-debug-androidTest.apk.sha256"

          upload_file() {
            local src="$1" url="$2" label="$3" expected_checksum="${4:-}"
            HTTP=$(curl -sw '%{http_code}' -o /tmp/pkg-resp.txt \
              -X PUT "$url" \
              -H "Authorization: token $PKG_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$src")
            BODY=$(cat /tmp/pkg-resp.txt)
            if [ "$HTTP" -eq 201 ] || [ "$HTTP" -eq 200 ]; then
              echo "::notice::${label}: uploaded (HTTP $HTTP)"
            elif [ "$HTTP" -eq 409 ]; then
              # Already exists from a previous attempt — verify checksum if provided.
              echo "::notice::${label}: version exists (HTTP 409) — verifying checksum"
              if [ -n "$expected_checksum" ]; then
                # Fetch the corresponding .sha256 file from the same version.
                SHA_FETCH_URL="${url%.apk}.apk.sha256"
                REMOTE_SHA=$(curl -sf \
                  -H "Authorization: token $PKG_TOKEN" \
                  "$SHA_FETCH_URL" | tr -d '[:space:]') || true
                if [ "$REMOTE_SHA" = "$expected_checksum" ]; then
                  echo "::notice::${label}: checksum matches existing upload — OK"
                else
                  echo "::error::${label}: checksum mismatch on existing upload (remote=$REMOTE_SHA local=$expected_checksum)"
                  exit 1
                fi
              fi
            else
              echo "::error::${label}: unexpected HTTP $HTTP from package registry"
              echo "$BODY"
              exit 1
            fi
          }

          upload_file "$APK_SRC"       "$PKG_URL"       "APK"         "$CHECKSUM"
          upload_file "$SHA256_SRC"    "$SHA_URL"       "SHA256"
          upload_file "$TEST_APK_SRC"  "$TEST_PKG_URL"  "TestAPK"     "$TEST_CHECKSUM"
          upload_file "$TEST_SHA256_SRC" "$TEST_SHA_URL" "TestSHA256"

          # Update the `latest` pointer (a text file containing the sha).
          # Both APKs are versioned under this sha; consuming the latest pointer
          # gives the device nightly the correct sha to download both files.
          LATEST_URL="${PKG_BASE}/latest/latest.sha"
          HTTP=$(curl -sw '%{http_code}' -o /tmp/latest-resp.txt \
            -X PUT "$LATEST_URL" \
            -H "Authorization: token $PKG_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-raw "$COMMIT_SHA")
          BODY=$(cat /tmp/latest-resp.txt)
          if [ "$HTTP" -eq 201 ] || [ "$HTTP" -eq 200 ] || [ "$HTTP" -eq 409 ]; then
            # On 409 for latest, force-overwrite by deleting and re-uploading.
            if [ "$HTTP" -eq 409 ]; then
              echo "::notice::latest pointer exists — overwriting"
              # Delete the old version first.
              curl -sf -X DELETE "${PKG_BASE}/latest/latest.sha" \
                -H "Authorization: token $PKG_TOKEN" || true
              HTTP2=$(curl -sw '%{http_code}' -o /dev/null \
                -X PUT "$LATEST_URL" \
                -H "Authorization: token $PKG_TOKEN" \
                -H "Content-Type: text/plain" \
                --data-raw "$COMMIT_SHA")
              echo "::notice::latest pointer overwrite: HTTP $HTTP2"
            else
              echo "::notice::latest pointer: HTTP $HTTP"
            fi
          else
            echo "::error::latest pointer: unexpected HTTP $HTTP"
            echo "$BODY"
            exit 1
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # TASK-126: radioshake-nightly (env.NIGHTLY) labels its artifact
          # 'nightly' just like the schedule tick; radioshake-main-check
          # (the other repository_dispatch type) keeps 'main-check'.
          name: results-${{ env.NIGHTLY == 'true' && 'nightly' || (github.event_name == 'repository_dispatch' && 'main-check') || inputs.tier }}
          path: |
            ~/.maestro/tests/**
            src/tier-results.json
            src/maestro-results/**
            !src/maestro-results/r8check-logcat.txt
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Publish results to the E2E dashboard.
  # Runs always so a broken build/boot is never absent from the dashboard.
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    needs: [skip-gate, e2e]
    if: always() && needs.skip-gate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # TASK-126: same NIGHTLY notion as the e2e job — true for schedule and
    # for the radioshake-nightly repository_dispatch, used below so nightly
    # dispatch runs join the combined dashboard suite the same way schedule
    # runs do.
    env:
      NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'radioshake-nightly') }}

    steps:
      - name: Clone CI scripts from source repo
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          # Use 'main' for repository_dispatch (sha cannot be used as --branch flag).
          REF: ${{ github.event_name == 'repository_dispatch' && 'main' || inputs.ref || 'main' }}
        run: |
          set -eu
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src

      - name: Download tier-results artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true

      - name: Publish results to dashboard
        env:
          E2E_INGEST_URL:  ${{ secrets.E2E_INGEST_URL }}
          E2E_INGEST_TOKEN: ${{ secrets.E2E_INGEST_TOKEN }}
          E2E_WORKFLOW: maestro-nightly-emulator
          COMMIT_SHA: ${{ needs.e2e.outputs.commit_sha || 'unknown' }}
          COMMIT_MSG: ${{ needs.e2e.outputs.commit_msg }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ env.NIGHTLY }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          SUITE_ID_INPUT: ${{ inputs.suite_id }}
        run: |
          set -eu

          # Resolve SUITE_ID:
          #   - scheduled runs, and radioshake-nightly dispatch (TASK-126,
          #     NIGHTLY=true): date in +6h window (emulator at 23:30/23:25 +
          #     device at 01:00 share a date)
          #   - radioshake-main-check dispatch: "" (ungrouped — the sha drives the check)
          #   - workflow_dispatch with suite_id input: use the forced value (for verification)
          #   - workflow_dispatch without suite_id: "" (ungrouped)
          if [ "$NIGHTLY" = "true" ]; then
            SUITE_ID=$(date -u -d '+6 hours' +%F)
          elif [ -n "${SUITE_ID_INPUT:-}" ]; then
            SUITE_ID="$SUITE_ID_INPUT"
          else
            SUITE_ID=""
          fi

          # HALF:
          #   - scheduled runs, radioshake-nightly dispatch (NIGHTLY=true), or
          #     forced suite_id (verification dispatches): emulator
          #   - all other dispatch events (radioshake-main-check, plain
          #     workflow_dispatch without suite_id): omit (ungrouped or explicit sha run)
          if [ "$NIGHTLY" = "true" ] || [ -n "${SUITE_ID:-}" ]; then
            HALF=emulator
          else
            HALF=""
          fi

          # Resolve TIERS_JSON from the downloaded artifact or use infra-failure fallback.
          # The upload-artifact action uses the least-common-ancestor of all upload paths as
          # the root (here: /home/runner, because ~/.maestro/** and src/tier-results.json
          # share that ancestor). After download into artifacts/, the file lands at a nested
          # path — use find to locate it robustly regardless of the extracted layout.
          TIERS_JSON=""
          TIER_FILE=$(find artifacts -name tier-results.json 2>/dev/null | head -1)
          if [ -n "$TIER_FILE" ]; then
            TIERS_JSON=$(cat "$TIER_FILE")
            echo "::notice::tier-results.json resolved at: $TIER_FILE"
          fi

          # Fallback: if no tiers ran (build/boot failure), report a synthetic infra tier.
          # If the e2e job succeeded but no tier-results.json was found, that is an infra
          # bug — publish the synthetic record AND exit 1 so the run is visibly red.
          MISSING_AFTER_SUCCESS=false
          if [ -z "$TIERS_JSON" ] || [ "$TIERS_JSON" = "[]" ]; then
            FAILED_STEP="build-or-boot-failed"
            if [ "$E2E_RESULT" = "failure" ]; then
              FAILED_STEP="emulator-job-failed"
            elif [ "$E2E_RESULT" = "cancelled" ]; then
              FAILED_STEP="emulator-job-cancelled"
            elif [ "$E2E_RESULT" = "success" ]; then
              FAILED_STEP="tier-results-missing-after-success"
              MISSING_AFTER_SUCCESS=true
              echo "::error::e2e job succeeded but tier-results.json was not found in the downloaded artifact — infra bug"
            fi
            # failed_flows must be a JSON array (API validates type=list).
            TIERS_JSON="[{\"name\":\"infra\",\"passed\":0,\"failed\":1,\"total\":1,\"failed_flows\":[\"${FAILED_STEP}\"]}]"
          fi

          # Resolve commit message (fall back to "n/a" if e2e was skipped/failed before clone).
          COMMIT_MSG="${COMMIT_MSG:-n/a}"

          # Run publish script — fail loud, no || true.
          SUITE_ID="$SUITE_ID" \
          HALF="$HALF" \
          COMMIT_SHA="$COMMIT_SHA" \
          COMMIT_MSG="$COMMIT_MSG" \
          RUN_URL="$RUN_URL" \
          TIERS_JSON="$TIERS_JSON" \
            python3 src/ci/publish-results.py

          # Fail loud: a green e2e run that produced no tier results is an infra bug.
          if [ "$MISSING_AFTER_SUCCESS" = "true" ]; then
            echo "::error::Publish succeeded but tier results were missing — exiting non-zero"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Forgejo commit status callback for repository_dispatch (push-to-main bridge).
  # Reports emulator result back to the Forgejo commit status API.
  #
  # Only radioshake-main-check posts a status here. TASK-126: radioshake-nightly
  # is treated like `schedule` everywhere else in this workflow, and `schedule`
  # never posts a commit status — so radioshake-nightly is excluded explicitly
  # below, since both dispatch types share github.event_name == 'repository_dispatch'
  # and job-level env (NIGHTLY) is not available in a job's own `if:`.
  # ──────────────────────────────────────────────────────────────────────────
  forgejo-status:
    needs: [e2e]
    if: >-
      always() && github.event_name == 'repository_dispatch' &&
      github.event.action != 'radioshake-nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report commit status to Forgejo
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          STATUS_TOKEN: ${{ secrets.FORGEJO_STATUS_TOKEN }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMMIT_SHA: ${{ github.event.client_payload.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          echo "::add-mask::$STATUS_TOKEN"

          # Map GitHub job result to Forgejo commit status state.
          case "$E2E_RESULT" in
            success)   STATE=success ;;
            failure)   STATE=failure ;;
            cancelled) STATE=error   ;;
            *)         STATE=error   ;;
          esac

          DESCRIPTION="Emulator E2E: $STATE"

          curl -sf -X POST \
            "https://${HOST}/api/v1/repos/hiten/RadioShake/statuses/${COMMIT_SHA}" \
            -H "Authorization: token $STATUS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"context\": \"github/emulator-e2e\",
              \"state\": \"${STATE}\",
              \"target_url\": \"${RUN_URL}\",
              \"description\": \"${DESCRIPTION}\"
            }"
          echo "Posted commit status: $STATE for $COMMIT_SHA"

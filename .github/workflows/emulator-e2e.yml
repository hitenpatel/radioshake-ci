name: emulator-e2e

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to run
        type: choice
        options:
          - tier1-smoke
          - tier2-features
          - tier3-deep
          - r8check
          - auto-instrumentation
          - i18n
        default: tier1-smoke
      ref:
        description: Source ref to clone (Forgejo branch or tag)
        default: main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # KVM access is required for the hardware-accelerated emulator.
      # This udev rule grants the runner's user group read/write on /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # Clone the private source repo using a per-request Authorization header
      # so the credential is never written to .git/config or the filesystem.
      - name: Clone source from private host
        env:
          HOST: ${{ secrets.FORGEJO_HOST }}
          TOKEN: ${{ secrets.FORGEJO_CLONE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          AUTH=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch "$REF" "https://${HOST}/hiten/RadioShake.git" src
          git -C src rev-parse HEAD > head.sha
          # Fail the job if the auth header was persisted to .git/config.
          ! grep -rq "AUTHORIZATION" src/.git/config

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # Ensure the SDK level used in the build is present (GitHub images carry
      # a recent SDK but the exact platform version may differ across image updates).
      - name: Ensure Android SDK 36 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Pin Maestro to a known-good release so a new upstream release cannot
      # silently change matcher behaviour and flip flows green/red.
      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: "2.8.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build debug APK
        working-directory: src
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug

      # android-emulator-runner boots the emulator, waits for it to be ready,
      # then runs the `script` with the emulator still alive. CWD for `script`
      # is the runner workspace, not the matrix directory, so we cd into src/.
      # TIER is passed via env (not interpolated into `script:`) to prevent
      # command injection — type:choice is not enforced for API-triggered
      # workflow_dispatch calls.
      - name: Run tier on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          TIER: ${{ inputs.tier }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: cd src && bash ci/emulator-tier.sh "$TIER"

      # Upload Maestro run logs and tier-results.json.
      # local.properties, gradle caches, and raw logcat dumps are NOT included.
      # r8check-logcat.txt is deleted by emulator-tier.sh before this step runs;
      # the exclude below is belt-and-braces in case the script exits early.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-${{ inputs.tier }}
          path: |
            ~/.maestro/tests/**
            src/tier-results.json
            src/maestro-results/**
            !src/maestro-results/r8check-logcat.txt
          if-no-files-found: warn
